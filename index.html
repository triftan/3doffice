<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Person Company — 3D AI Office</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1220;color:#e8ecf5;overflow:hidden}
#scene{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:10px;align-items:center;padding:10px 14px;pointer-events:none}
#top button{pointer-events:auto}
#top h1{font-size:16px;margin:0;text-shadow:0 1px 4px #000}
#top h1{font-size:18px;margin:0}#top p{margin:0;color:#9aa7bd;font-size:13px}
#panel{position:fixed;top:74px;right:12px;bottom:12px;width:380px;max-width:92vw;background:#111a2e;border:1px solid #26344f;border-radius:16px;display:flex;flex-direction:column;z-index:10;overflow:hidden}
#panel header{padding:14px;border-bottom:1px solid #26344f}
#agentName{font-size:18px;font-weight:800}#agentRole{color:#9aa7bd;font-size:13px}
#status{margin-top:8px;font-size:13px}#status b{color:#7ee2a8}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:90%;white-space:pre-wrap;line-height:1.45;font-size:14px}
.me{background:#2563eb;align-self:flex-end}.ai{background:#1e293b;align-self:flex-start}
#quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-top:1px solid #26344f}
#quick button{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px}
#inputRow{display:flex;gap:8px;padding:12px;border-top:1px solid #26344f}
#inputRow input{flex:1;background:#0b1220;border:1px solid #334155;color:#fff;border-radius:10px;padding:10px}
#inputRow button{background:#f59e0b;color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
#left{position:fixed;left:12px;bottom:12px;z-index:10;background:#111a2ee6;border:1px solid #26344f;border-radius:16px;padding:12px;width:300px;max-width:92vw}
#left input,#left select{width:100%;margin-top:6px;background:#0b1220;border:1px solid #334155;color:#fff;border-radius:8px;padding:8px}
#left button{margin-top:8px;width:100%;background:#7ee2a8;color:#111;border:0;border-radius:8px;padding:9px;font-weight:800;cursor:pointer}
.small{color:#9aa7bd;font-size:12px;line-height:1.4}
#hint{position:fixed;left:12px;top:74px;z-index:10;background:#111a2ecc;padding:10px 12px;border-radius:12px;font-size:13px}
.msgActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.msgActions button{background:#0b1220;color:#cbd5e1;border:1px solid #334155;border-radius:999px;padding:5px 9px;cursor:pointer;font-size:11px}
#boardModal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center}
#boardBox{background:#111a2e;border:1px solid #26344f;border-radius:16px;width:640px;max-width:92vw;max-height:84vh;overflow:auto;padding:18px}
.boardItem{border:1px solid #26344f;border-radius:12px;padding:12px;margin-top:10px}.boardItem pre{white-space:pre-wrap;background:#0b1220;padding:10px;border-radius:8px;max-height:180px;overflow:auto}
@media(max-width:700px){#panel{top:auto;height:48vh;left:12px;right:12px;width:auto;display:none}#chatBtn{display:inline-block}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="scene"></div>
<div id="top"><div><h1>One Person Company</h1></div>
<button onclick="runAll()" style="margin-left:auto;background:#f59e0b;border:0;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer">▶ Run all 4 agents</button>
<button onclick="openBoard()" style="background:#111a2e;color:#fff;border:1px solid #334155;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer">📋 Saved outputs (<span id="savedCount">0</span>)</button></div>
<div id="boardModal"><div id="boardBox"><h2 style="margin:0">Saved outputs</h2><p class="small">Reuse outputs across agents.</p><div id="boardList"></div><button onclick="closeBoard()" style="margin-top:12px;background:#f59e0b;border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer">Close</button></div></div>

<div id="agentChips" style="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw">
<button onclick="selectAgent(AGENTS[0]);showPanel()" style="background:#111a2ee6;color:#fff;border:1px solid #38bdf8;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700">Offer</button>
<button onclick="selectAgent(AGENTS[1]);showPanel()" style="background:#111a2ee6;color:#fff;border:1px solid #7ee2a8;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700">Prospector</button>
<button onclick="selectAgent(AGENTS[2]);showPanel()" style="background:#111a2ee6;color:#fff;border:1px solid #f59e0b;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700">Money</button>
<button onclick="selectAgent(AGENTS[3]);showPanel()" style="background:#111a2ee6;color:#fff;border:1px solid #f472b6;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700">Content</button>
<button id="chatBtn" onclick="showPanel()" style="display:none;background:#f59e0b;border:0;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:800">Chat</button>
</div>
<div id="panel">
<header><div style="display:flex;justify-content:space-between;align-items:center"><div id="agentName">Select an agent</div><button onclick="hidePanel()" style="background:none;border:0;color:#9aa7bd;font-size:20px;cursor:pointer;line-height:1">×</button></div><div id="agentRole">Click any robot in the office, or use the buttons below.</div>
<div id="status">Status: <b id="statusText">Idle</b></div></header>
<div id="chat"><div class="msg ai">Click an agent to start.</div></div>
<div id="quick"></div>
<div id="inputRow"><input id="userInput" placeholder="Talk to this agent..."><button onclick="sendMsg()">Send</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const AGENTS=[
 {id:'offer',name:'Offer Architect',color:0x38bdf8,role:'Turns your expertise into a packaged, priced offer',pos:[-4.5,0,-3],quick:['Build my offer','Define my buyer','Answer objections'],
  system:'You are Offer Architect, an AI agent in Brandon Lee\'s One Person Company office. Build offers ONLY with Alex Hormozi\'s $100M Offers framework. Step 1: Value Equation — Dream Outcome x Perceived Likelihood of Achievement, divided by Time Delay x Effort and Sacrifice. Increase the top, decrease the bottom. Step 2: List every problem the buyer has before, during and after buying, then list a solution for each problem. Step 3: Trim and Stack — keep only solutions that move the dream outcome, bundle them as one offer, and name each part. Step 4: Scarcity (limited seats/slots), Urgency (deadline, bonus expiry), Bonuses (solve a remaining problem, each with a value), and Guarantees (reverse risk: if you do X and do not get Y in Z, we do W). Step 5: Name the offer, state who it is for and not for, and price it only if the user gives a price or asks for a price range; otherwise say price is worked out on a call. Be concrete, short, and practical. Never invent revenue claims, testimonials, or client results.',
  demo:'DEMO OFFER\nOffer: AI coaching for busy business owners, 4 weeks, done with you.\nPromise: Save 15 hours a week, with a business that keeps running.\nBuyer: Business owners doing everything themselves.\nObjections: Not technical? We build it with you. No time? 90 minutes a week. Will it work? Start with the one job that hurts most.'},
 {id:'prospector',name:'Prospector',color:0x7ee2a8,role:'Finds prospects, researches them, and emails in your voice',pos:[4.5,0,-3],quick:['Find 10 prospects','Draft 3 emails','Write a follow-up'],
  system:'You are Prospector, an AI agent in Brandon Lee\'s One Person Company office. Follow Brandon\'s own method, in order: 1 Find — build a list that fits the user\'s ideal profile only. 2 Research — one specific, real observation per prospect (what they teach, sell, or post). 3 Qualify — fit, pain, and timing, and drop bad fits. 4 Personalise — every email different, subject and body tied to that observation, in the user\'s voice. 5 Send and follow up — short, one ask, no hard sell. Do not invent real contact details. Use sample names only unless the user supplies real ones.',
  demo:'DEMO PROSPECTS\n1. Bright Path Training — schools/training — fits profile\n2. North Star Academy — schools/training — fits profile\n3. City Skills Institute — schools/training — fits profile\nEmail sample: Subject: A quick idea for Bright Path — Hi team, I noticed you teach busy professionals who want practical AI skills, not theory. Would a short call help to see which agent saves your team the most time first?'},
 {id:'money',name:'Money Agent',color:0xf59e0b,role:'Reads invoices, chases payments, gives a Monday snapshot',pos:[-4.5,0,3],quick:['Monday snapshot','Draft a chase email','Categorise my money'],
  system:'You are Money Agent, an AI agent in Brandon Lee\'s One Person Company office. Follow this loop, in order: 1 Capture — read receipts and invoices. 2 Categorise — what came in, what is owed, what is overdue. 3 Monday Snapshot — cash position, overdue list, and the one action that matters. 4 Chase — draft the chase email, but never send without the user\'s approval. Human-in-the-loop is the rule, so the user keeps the client relationship. Use sample numbers only unless the user supplies real ones.',
  demo:'DEMO MONDAY SNAPSHOT\nCame in: SGD 4,500 last week.\nOwed: SGD 3,200 from 3 clients.\nOverdue: 1 invoice, 7 days, SGD 1,200.\nNeeds you: Approve 1 chase email. Nothing else needs you today.\nChase draft: Hi, just a friendly check, invoice INV-1042 for SGD 1,200 is now 7 days overdue. Could you let me know when payment will be sent?'},
 {id:'content',name:'Content Machine',color:0xf472b6,role:'One voice note in, a week of content out',pos:[4.5,0,3],quick:['Week of content','Turn my idea into posts','Write a video script'],
  system:'You are Content Machine, an AI agent in Brandon Lee\'s One Person Company office. Follow this repurposing framework: 1 Capture — one voice note or one long video. 2 Extract — the one big idea, then 3 to 5 supporting points. 3 Repurpose — turn that one idea into a week: short post, carousel, email, 60-second script, image idea, and avatar video idea. 4 Distribute — one piece per day, in the user\'s voice, with one clear next step. Keep it practical, one idea per day, and never claim results the user has not given you.',
  demo:'DEMO WEEK OF CONTENT\nMon: Short post — the one idea, in your voice.\nTue: Email — the story behind it.\nWed: Carousel — 5 slides, why it matters.\nThu: Video script — 60 seconds, hook first.\nFri: Post — one example, one result.\nSat: Email — objection answered, plus call to book.\nSun: Recap — the week, and what is next.'},
];
let selected=AGENTS[0], histories={}, totalCost=0;
AGENTS.forEach(a=>histories[a.id]=[]);

// 3D scene
const scene=new THREE.Scene();scene.background=new THREE.Color(0xfdf6ec);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('scene').appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);camera.position.set(0,10,12);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.maxPolarAngle=Math.PI/2.2;controls.enablePan=true;controls.screenSpacePanning=false;controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
scene.add(new THREE.AmbientLight(0xfff4e0,0.95));const sun=new THREE.DirectionalLight(0xffe8b0,1.1);sun.position.set(5,10,5);scene.add(sun);
const floor=new THREE.Mesh(new THREE.BoxGeometry(16,0.2,12),new THREE.MeshStandardMaterial({color:0xe9dcc3}));floor.position.y=-0.1;scene.add(floor);
const rug=new THREE.Mesh(new THREE.BoxGeometry(6,0.05,4),new THREE.MeshStandardMaterial({color:0xf3c6a5}));rug.position.y=0.03;scene.add(rug);
// meeting table + CEO desk
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m}
box(3,0.15,1.6,0x8b5a2b,0,0.75,0);box(0.15,0.75,0.15,0x555, -1.3,0.37,0);box(0.15,0.75,0.15,0x555,1.3,0.37,0);
box(2.4,0.12,1,0x475569,0,0.7,5.2); // CEO desk, user
// coffee bar + plants
box(2,1,0.6,0x64748b,-6.5,0.5,4);box(0.4,0.6,0.4,0x16a34a,-7,0.9,-4);box(0.4,0.6,0.4,0x16a34a,7,0.9,-4);box(0.4,0.6,0.4,0x16a34a,7,0.9,4);

function makeBubble(){const c=document.createElement('canvas');c.width=512;c.height=128;const tex=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(3.2,0.8,1);return {sp,c,tex}}
function drawBubble(b,text){const ctx=b.c.getContext('2d');ctx.clearRect(0,0,512,128);ctx.fillStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.roundRect(10,10,492,108,20);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 28px system-ui';ctx.fillText(text.slice(0,34),24,60);ctx.font='22px system-ui';ctx.fillText(text.slice(34,68),24,92);b.tex.needsUpdate=true}

const robots={};
AGENTS.forEach(a=>{
 const g=new THREE.Group();g.position.set(...a.pos);g.userData.home=new THREE.Vector3(...a.pos);
 // cute rounded robot: capsule body, sphere head, big eyes, antenna, little legs
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.42,0.55,6,16),new THREE.MeshStandardMaterial({color:a.color,roughness:0.6}));body.position.y=0.95;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.42,24,18),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4}));head.position.y=1.85;g.add(head);
 const face=new THREE.Mesh(new THREE.SphereGeometry(0.32,24,18),new THREE.MeshStandardMaterial({color:0x1f2937,roughness:0.3}));face.position.set(0,1.85,0.28);face.scale.set(1,0.75,0.5);g.add(face);
 const eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});
 const e1=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,10),eyeMat);e1.position.set(-0.13,1.9,0.5);g.add(e1);
 const e2=e1.clone();e2.position.x=0.13;g.add(e2);
 const pupilMat=new THREE.MeshBasicMaterial({color:0x111111});
 const pu1=new THREE.Mesh(new THREE.SphereGeometry(0.035,10,8),pupilMat);pu1.position.set(-0.13,1.9,0.56);g.add(pu1);
 const pu2=pu1.clone();pu2.position.x=0.13;g.add(pu2);
 const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.3),new THREE.MeshStandardMaterial({color:a.color}));ant.position.y=2.35;g.add(ant);
 const antTip=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,10),new THREE.MeshBasicMaterial({color:a.color}));antTip.position.y=2.52;g.add(antTip);
 const armL=new THREE.Mesh(new THREE.CapsuleGeometry(0.09,0.4,4,10),new THREE.MeshStandardMaterial({color:a.color}));armL.position.set(-0.55,1.0,0.3);g.add(armL);
 const armR=armL.clone();armR.position.x=0.55;g.add(armR);
 const legL=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.35,0.22),new THREE.MeshStandardMaterial({color:0x374151}));legL.position.set(-0.2,0.18,0);g.add(legL);
 const legR=legL.clone();legR.position.x=0.2;g.add(legR);
 const desk=box(1.9,0.12,1,0xb08968,a.pos[0],0.7,a.pos[2]+(a.pos[2]>0?-0.95:0.95));
 const lap=box(0.7,0.05,0.45,0x111827,a.pos[0],0.8,a.pos[2]+(a.pos[2]>0?-0.95:0.95));
 const scr=box(0.7,0.45,0.03,new THREE.MeshBasicMaterial({color:a.color}),a.pos[0],1.05,a.pos[2]+(a.pos[2]>0?-1.15:1.15));
 g.userData={armL,armR,head,scr,legL,legR,baseY:1.85,walking:false,target:null,spin:0,jump:0};
 const ring=new THREE.Mesh(new THREE.RingGeometry(0.9,1.05,32),new THREE.MeshBasicMaterial({color:a.color,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=0.06;ring.visible=false;g.add(ring);g.userData.ring=ring;
 const b=makeBubble();b.sp.position.set(0,2.9,0);g.add(b.sp);drawBubble(b,'🤖 '+a.name);g.userData.bubble=b;
 g.userData.agent=a;scene.add(g);robots[a.id]=g;
 const hit=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.8,1.6),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=1.4;hit.userData.agent=a;g.add(hit);
 g.traverse(o=>{o.userData.agent=a});
});

// Finish effects: confetti, a dog that runs to the finished agent, desk signs.
const confettiGroup=new THREE.Group();scene.add(confettiGroup);let confettiBits=[];
function burstConfetti(x,y,z){const cols=[0xef476f,0xffd166,0x06d6a0,0x118ab2,0xf78c6b,0xb388eb];for(let i=0;i<120;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(0.08,0.12),new THREE.MeshBasicMaterial({color:cols[i%cols.length],side:THREE.DoubleSide}));m.position.set(x,y,z);m.userData={vx:(Math.random()-0.5)*3,vy:3+Math.random()*3,vz:(Math.random()-0.5)*3,spin:Math.random()*8,life:3+Math.random()*2};confettiGroup.add(m);confettiBits.push(m);}}
function updateConfetti(dt){confettiBits=confettiBits.filter(m=>{m.userData.life-=dt;if(m.userData.life<=0){confettiGroup.remove(m);return false}m.userData.vy-=4*dt;m.position.x+=m.userData.vx*dt;m.position.y+=m.userData.vy*dt;m.position.z+=m.userData.vz*dt;if(m.position.y<0.05)m.position.y=0.05;m.rotation.x+=m.userData.spin*dt;m.rotation.y+=m.userData.spin*dt;return true})}
// Office dog
const dog=new THREE.Group();const dogBody=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.25,0.3),new THREE.MeshStandardMaterial({color:0xd4a373}));dogBody.position.y=0.25;dog.add(dogBody);const dogHead=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.25,0.25),new THREE.MeshStandardMaterial({color:0xd4a373}));dogHead.position.set(0.35,0.4,0);dog.add(dogHead);const dogTail=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.25,0.05),new THREE.MeshStandardMaterial({color:0x8b5a2b}));dogTail.position.set(-0.3,0.45,0);dog.add(dogTail);dog.position.set(0,0,1.5);scene.add(dog);let dogTarget=null;
function dogTo(x,z){dogTarget=new THREE.Vector3(x,0,z);}
// Desk signs with agent names
AGENTS.forEach(a=>{const c=document.createElement('canvas');c.width=256;c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,256,64);ctx.fillStyle='#111';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText(a.name,128,40);const tex=new THREE.CanvasTexture(c);const sign=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.28),new THREE.MeshBasicMaterial({map:tex}));sign.position.set(a.pos[0],0.95,a.pos[2]+(a.pos[2]>0?-1.45:1.45));sign.rotation.y=a.pos[2]>0?Math.PI:0;scene.add(sign);});

window.hidePanel=function(){document.getElementById("panel").style.display="none";document.getElementById("chatBtn").style.display="inline-block"};
window.showPanel=function(){document.getElementById("panel").style.display="flex";document.getElementById("chatBtn").style.display="none"};
function selectAgent(a){selected=a;document.getElementById('agentName').textContent=a.name;document.getElementById('agentRole').textContent=a.role;setStatus('Ready');AGENTS.forEach(x=>robots[x.id].userData.ring.visible=(x.id===a.id));
 const q=document.getElementById('quick');q.innerHTML='';a.quick.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{document.getElementById('userInput').value=t;sendMsg()};q.appendChild(b)});
 const chat=document.getElementById('chat');chat.innerHTML='';histories[a.id].forEach(m=>addMsg(m.text,m.role==='user'?'me':'ai',false));if(!histories[a.id].length)addMsg('Hi, I am '+a.name+'. '+a.role+'. What should I work on?', 'ai',false);}
function setStatus(s){document.getElementById('statusText').textContent=s;const b=robots[selected.id].userData.bubble;drawBubble(b,'🤖 '+selected.name+': '+s)}
let savedOutputs=[];try{savedOutputs=JSON.parse(localStorage.getItem('opc_saved_outputs')||'[]')}catch(e){savedOutputs=[]}
function updateSavedCount(){const el=document.getElementById('savedCount');if(el)el.textContent=savedOutputs.length}
function persistSaved(){localStorage.setItem('opc_saved_outputs',JSON.stringify(savedOutputs));updateSavedCount()}
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('Copied'))}
function saveOutput(agentId,text,silent=false){savedOutputs.unshift({agent:agentId,agentName:(AGENTS.find(a=>a.id===agentId)||{}).name||agentId,text,time:new Date().toLocaleString()});persistSaved();if(!silent)alert('Saved to the office board.')}
function handoff(fromId,text,toId){const to=AGENTS.find(a=>a.id===toId);selectAgent(to);document.getElementById('userInput').value='Use this output from '+fromId+' as context, then do your job on it:\n\n'+text;document.getElementById('userInput').focus()}
window.copyText=copyText;window.saveOutput=saveOutput;window.handoff=handoff;
window.boardCopy=i=>copyText(savedOutputs[i].text);window.boardHandoff=(i,to)=>handoff(savedOutputs[i].agent,savedOutputs[i].text,to);window.boardDelete=i=>{savedOutputs.splice(i,1);persistSaved();openBoard()};
function openBoard(){const list=document.getElementById('boardList');if(!savedOutputs.length)list.innerHTML='<p class="small">Nothing saved yet. Click Save on any agent reply.</p>';else list.innerHTML=savedOutputs.map((s,i)=>`<div class="boardItem"><b>${s.agentName}</b> <span class="small">${s.time}</span><pre>${s.text.replace(/</g,'&lt;')}</pre><div class="msgActions"><button onclick="boardCopy(${i})">Copy</button><button onclick="boardHandoff(${i},'offer')">Send to Offer</button><button onclick="boardHandoff(${i},'prospector')">Send to Prospector</button><button onclick="boardHandoff(${i},'money')">Send to Money</button><button onclick="boardHandoff(${i},'content')">Send to Content</button><button onclick="boardDelete(${i})">Delete</button></div></div>`).join('');document.getElementById('boardModal').style.display='flex'}
function closeBoard(){document.getElementById('boardModal').style.display='none'}
window.openBoard=openBoard;window.closeBoard=closeBoard;
function addMsg(text,cls,save=true){const d=document.createElement('div');d.className='msg '+cls;const span=document.createElement('span');span.textContent=text;d.appendChild(span);if(cls==='ai'&&save){const acts=document.createElement('div');acts.className='msgActions';const agentId=selected.id;const b1=document.createElement('button');b1.textContent='Copy';b1.onclick=()=>copyText(text);const b2=document.createElement('button');b2.textContent='Save';b2.onclick=()=>saveOutput(agentId,text);acts.append(b1,b2);AGENTS.filter(a=>a.id!==agentId).forEach(a=>{const b=document.createElement('button');b.textContent='Send to '+a.name;b.onclick=()=>handoff(agentId,text,a.id);acts.appendChild(b)});d.appendChild(acts)}const c=document.getElementById('chat');c.appendChild(d);c.scrollTop=c.scrollHeight;if(save)histories[selected.id].push({role:cls==='me'?'user':'assistant',text});updateSavedCount();}
window.sendMsg=async function(){const inp=document.getElementById('userInput');const text=inp.value.trim();if(!text)return;inp.value='';addMsg(text,'me');setStatus('Working...');robots[selected.id].userData.scr.material.color.set(0xffffff);
 let reply='';
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent:selected.id,model:'deepseek/deepseek-v4.1-flash',text,messages:histories[selected.id].slice(0,-1).map(m=>({role:m.role,content:m.text}))})});
   const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));reply=j.reply||'(no reply)';
   if(j.usage){const cost=(j.usage.prompt_tokens*0.000000045+j.usage.completion_tokens*0.0000005);totalCost+=cost;}
   }catch(e){reply='Server call failed: '+e.message+'. Demo output:\n'+selected.demo;}
 addMsg(reply,'ai');robots[selected.id].userData.spin=1;robots[selected.id].userData.jump=1;burstConfetti(robots[selected.id].position.x,2.5,robots[selected.id].position.z);dogTo(robots[selected.id].position.x,robots[selected.id].position.z);setStatus('Done — output saved in chat');robots[selected.id].userData.scr.material.color.set(selected.color);
};
window.runAll=async function(){for(const a of AGENTS){selectAgent(a);document.getElementById('userInput').value=a.quick[0];await sendMsg();const last=histories[a.id].filter(m=>m.role==='assistant').pop();if(last)saveOutput(a.id,last.text,true);await new Promise(r=>setTimeout(r,400));}selectAgent(AGENTS[0]);alert('Run all done. Check Saved outputs for all 4 results.')};
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY});
renderer.domElement.addEventListener('click',e=>{
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>6)return; // this was a drag to move the map, not a click
 mouse.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){let o=h.object;while(o&&!o.userData.agent)o=o.parent;if(o&&o.userData.agent){selectAgent(o.userData.agent);showPanel();break}}
});
selectAgent(AGENTS[0]);
let t=0;function animate(){requestAnimationFrame(animate);t+=0.02;
 AGENTS.forEach((a,i)=>{
  const u=robots[a.id].userData, g=robots[a.id];
  // occasional walk to coffee (viral idle behaviour): only if not selected/working
  if(!u.walking && Math.random()<0.0006){u.walking=true;u.target=new THREE.Vector3(-6.5,0,4);}
  if(u.walking && u.target){
    const dir=new THREE.Vector3().subVectors(u.target,g.position);dir.y=0;const dist=dir.length();
    if(dist<0.2){ if(u.target.x===-6.5){u.target=g.userData.home.clone();} else {u.walking=false;} }
    else {dir.normalize();g.position.addScaledVector(dir,0.03);g.rotation.y=Math.atan2(dir.x,dir.z);u.legL.rotation.x=Math.sin(t*12)*0.6;u.legR.rotation.x=-Math.sin(t*12)*0.6;u.armL.rotation.x=Math.sin(t*12)*0.4;u.armR.rotation.x=-Math.sin(t*12)*0.4;}
  } else {
    g.rotation.y=0;u.armL.rotation.x=Math.sin(t*3+i)*0.3;u.armR.rotation.x=Math.cos(t*3+i)*0.3;u.legL.rotation.x=0;u.legR.rotation.x=0;
  }
  if(u.spin>0){g.rotation.y+=0.25;u.spin-=0.03;if(u.spin<=0)g.rotation.y=0;}
  u.head.position.y=u.baseY+Math.sin(t*2+i)*0.03;
 });
 // jump on finish
 AGENTS.forEach(a=>{const u=robots[a.id].userData;if(u.jump>0){robots[a.id].position.y=Math.abs(Math.sin(u.jump*6))*0.4;u.jump-=0.02;if(u.jump<=0)robots[a.id].position.y=0;}});
 if(dogTarget){const d=new THREE.Vector3().subVectors(dogTarget,dog.position);d.y=0;if(d.length()<0.3){dogTarget=null;}else{d.normalize();dog.position.addScaledVector(d,0.05);dog.rotation.y=Math.atan2(d.x,d.z);dogTail.rotation.z=Math.sin(t*20)*0.5;}}
 updateConfetti(0.016);
 controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
